[workspace]
resolver = "3"

members = ["crates/blockguard-chain",
    "crates/blockguard-core",
    "crates/blockguard-crypto",
    "crates/blockguard-state",
    "crates/blockguard-chain", 
    "crates/blockguard-consensus",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
blockguard-core = { path = "crates/blockguard-core" }
blockguard-crypto = { path = "crates/blockguard-crypto" }
blockguard-state = { path = "crates/blockguard-state" }
blockguard-chain = { path = "crates/blockguard-chain" }
blockguard-consensus = { path = "crates/blockguard-consensus" }
sha2 = "0.11"
k256 = { version = "0.14", features = ["ecdsa", "sha256", "getrandom"] }
